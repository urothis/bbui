[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["ui_bevy_render", "bevy_winit", "bevy_pbr", "x11", "wayland", "system_clipboard", "default_font", "png", "jpeg", "webp"] }
bevy_app = "=0.20.1"
bevy_ecs = "=0.20.1"
bevy_time = "=0.20.1"
accesskit = "=0.24.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tga", "qoi", "hdr", "pnm"] }
resvg = { version = "=0.49.0", default-features = false, features = ["text", "raster-images"] }
criterion = { version = "=0.8.2", features = ["html_reports"] }
stats_alloc = "=0.1.10"
vp8-decoder = "=0.1.1"
webm-iterable = "=0.7.1"

