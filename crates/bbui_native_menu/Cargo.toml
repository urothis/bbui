[package]
name = "bbui_native_menu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSEvent", "NSCell"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSObject"] }

# Objective-C target/action registration is isolated in this crate.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
