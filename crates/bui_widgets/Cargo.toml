[package]
name = "bui_widgets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy_app = "=0.20.1"
bevy_asset = "=0.20.1"
bevy_camera = "=0.20.1"
bevy_ecs.workspace = true
bevy_image = "=0.20.1"
bevy_tasks = "=0.20.1"
bevy_time = "=0.20.1"
bevy_text = { version = "=0.20.1", features = ["default_font"] }
bui_core = { path = "../bui_core" }
bui_layout = { path = "../bui_layout" }
bui_media = { path = "../bui_media" }
bui_render = { path = "../bui_render" }
bui_style = { path = "../bui_style" }
bui_text = { path = "../bui_text" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

